# Made by bruce-method-release's setup from its ci.yml template. Change the template, or this repository's hooks, not
# this file: setup replaces it, and the release checks fail while it differs.
#
# The tests, and cargo-deny's checks of the dependencies' licences, advisories and sources, see deny.toml, on every push
# and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
